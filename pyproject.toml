[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cashinho"
version = "0.1.0"
description = "Copiloto de analise para day trade na B3 (analisa e orienta, nao executa ordens)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
yahoo = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
