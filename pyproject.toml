[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cashinho"
version = "0.1.0"
description = "Plataforma de análise quantitativa e apoio operacional para ativos da B3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "plotly>=5.24",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cashinho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: testes que tocam banco de dados ou I/O real",
]

[tool.ruff]
line-length = 100
src = ["src", "app", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["cashinho"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["plotly.*", "streamlit.*"]
ignore_missing_imports = true
