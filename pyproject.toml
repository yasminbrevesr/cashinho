[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cashinho"
version = "0.1.0"
description = "Copiloto de analise para day trade na B3 (analisa e orienta, nao executa ordens)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
yahoo = ["yfinance>=0.2"]
# MetaTrader 5 / Genial: a biblioteca so existe no Windows. O marker impede
# que 'pip install cashinho[metatrader]' quebre em Linux e na CI - e o codigo
# nunca a importa no nivel de modulo, entao o resto do projeto roda sem ela
metatrader = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# todos os testes do projeto sao funcoes; desligar a coleta de classes evita
# que nomes em portugues como TesteProtegidoError sejam confundidos com testes
python_classes = []
